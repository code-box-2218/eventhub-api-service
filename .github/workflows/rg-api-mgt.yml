name: Deploy API Management Resource Group

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/rg-api-mgt.yml"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:

env:
  TERRAFORM_VERSION: 1.5.0

jobs:
  terraform-validate:
    name: "Validate Terraform"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: |
          cd infra
          terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd infra
          terraform validate

  terraform-plan:
    name: "Plan Deployment"
    needs: terraform-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login
        uses: Azure/login@v1
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }
          auth-type: SERVICE_PRINCIPAL
          environment: azurecloud
          enable-AzPSSession: false
          allow-no-subscriptions: false

      - name: Terraform Init
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Plan
        id: plan
        run: |
          cd infra
          terraform plan -no-color \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="resource_group_name=rg-api-mgt" \
            -var="location=eastus" \
            -var="environment=dev" \
            -out=tfplan
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📋 Terraform Plan\n```\nResource Group: rg-api-mgt\nLocation: eastus\nEnvironment: dev\n```\nReview and merge to deploy.'
            });

  terraform-apply:
    name: "Deploy Infrastructure"
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login
        uses: Azure/login@v1
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }
          auth-type: SERVICE_PRINCIPAL
          environment: azurecloud
          enable-AzPSSession: false
          allow-no-subscriptions: false

      - name: Terraform Init
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Apply
        run: |
          cd infra
          terraform apply -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="resource_group_name=rg-api-mgt" \
            -var="location=eastus" \
            -var="environment=dev"

      - name: Get Deployment Outputs
        id: outputs
        run: |
          cd infra
          RG_NAME=$(terraform output -raw resource_group_name 2>/dev/null || echo "rg-api-mgt")
          RG_ID=$(terraform output -raw resource_group_id 2>/dev/null || echo "N/A")
          LOCATION=$(terraform output -raw location 2>/dev/null || echo "eastus")

          {
            echo "rg_name=${RG_NAME}"
            echo "rg_id=${RG_ID}"
            echo "location=${LOCATION}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 🚀 Resource Group Created"
            echo ""
            echo "**Resource Group:** ${RG_NAME}"
            echo "**Location:** ${LOCATION}"
            echo "**ID:** ${RG_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Deployment
        run: |
          echo "✅ Resource Group deployment completed successfully"

  deployment-summary:
    name: "Deployment Summary"
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read

    steps:
      - name: Success Notification
        if: needs.terraform-apply.result == 'success'
        run: |
          echo "✅ Resource Group created successfully!"
          echo ""
          echo "📝 Next Steps:"
          echo "1. Deploy your web application from your app repository"
          echo "2. Use resource group: rg-api-mgt"
          echo "3. Create App Service Plan and App Service in this resource group"

      - name: Failure Notification
        if: needs.terraform-apply.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs above for details."
          exit 1
