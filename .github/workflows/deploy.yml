name: Deploy Event Hub API Service

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:

env:
  TERRAFORM_VERSION: 1.5.0

jobs:
  validate:
    name: "Validate Terraform"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: |
          cd infra
          terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd infra
          terraform validate

  plan:
    name: "Plan Deployment"
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL

      - name: Terraform Init
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Plan
        id: plan
        run: |
          cd infra
          terraform plan -no-color \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var-file="terraform.tfvars"
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📋 Terraform Plan Ready\nReview changes and merge to deploy.'
            });

  apply:
    name: "Apply Deployment"
    needs: plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL

      - name: Terraform Init
        run: |
          cd infra
          terraform init -backend=false

      - name: Terraform Apply
        run: |
          cd infra
          terraform apply -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var-file="terraform.tfvars"

      - name: Get Outputs
        id: output
        run: |
          cd infra
          APP_URL=$(terraform output -raw app_service_url)
          APP_NAME=$(terraform output -raw app_service_name)
          EVENTHUB=$(terraform output -raw eventhub_name | grep -v "null" || echo "N/A")

          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "eventhub=$EVENTHUB" >> $GITHUB_OUTPUT

          echo "## ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**App:** $APP_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Event Hub:** $EVENTHUB" >> $GITHUB_STEP_SUMMARY

      - name: Verify Deployment
        run: |
          echo "Verifying deployment..."
          APP_URL="${{ steps.output.outputs.app_url }}"

          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo "✅ App is responding (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "⏳ Attempt $i/10..."
            sleep 5
          done
          echo "⚠️ Deployment successful, app still initializing"
