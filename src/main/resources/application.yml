spring:
  application:
    name: ${SPRING_APPLICATION_NAME:eventhub-api-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non-null
    serialization:
      indent-output: true
    time-zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:always}
    include-stacktrace: ${SERVER_ERROR_INCLUDE_STACKTRACE:on_param}
  compression:
    enabled: true
  http2:
    enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.codex: ${LOGGING_LEVEL_COM_CODEX:DEBUG}
  pattern:
    console: ${LOGGING_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}
    file: ${LOGGING_PATTERN_FILE:%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n}

app:
  name: ${APP_NAME:EventHub API Service}
  version: ${APP_VERSION:0.0.1}
  description: ${APP_DESCRIPTION:REST API for EventHub operations with clean architecture}

springdoc:
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    operations-sorter: ${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:method}
    tags-sorter: ${SPRINGDOC_SWAGGER_UI_TAGS_SORTER:alpha}
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  show-actuator: ${SPRINGDOC_SHOW_ACTUATOR:false}

azure:
  client-id: ${AZURE_CLIENT_ID:}
  client-secret: ${AZURE_CLIENT_SECRET:}
  tenant-id: ${AZURE_TENANT_ID:}